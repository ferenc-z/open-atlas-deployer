# 复杂流程实验（2026-11-22）：lab 四个 NiFi 上的"模拟生产"业务，用来测 Deployer 的业务发现引擎。
# 设计说明：知识库 designs/open-atlas-deployer-service-ops/complex-lab-flows.md。build.py 按本文件搭建。
#
# 写法
#   groups: 每个实例 root 下的 cx- 组（instance 为 lab 实例名）；sub: 嵌套子组（同样写法，可多层）。
#   paths:  一行一条链，节点用 " > " 隔开。节点 "K:名字" 是新建（K 见下），只写 "名字" 是引用本组已有的节点，
#           "子组名/端口名" 引用子组的端口，"名字[rel1,rel2]" 指定这一跳从该节点出去的关系（默认关系见 build.py KINDS）。
#           K：G GenerateFlowFile、U UpdateAttribute、R RouteOnAttribute、RC RouteOnContent、T ReplaceText、J EvaluateJsonPath、
#           S SplitText、SJ SplitJson、M MergeContent、L LogAttribute、LM LogMessage、A AttributesToJSON、C ConvertRecord(CSV→JSON)、
#           F PutFile、GF GetFile、LF ListFile、FF FetchFile、LH ListenHTTP、IH InvokeHTTP、CR ControlRate、Z CompressContent、
#           H 内容哈希、D DuplicateFlowFile、MT IdentifyMimeType、RF RetryFlowFile（1.11+）、
#           in 输入端口、out 输出端口、rin 远程输入端口（S2S 接收）、fn 漏斗、rpg 远程输入端口"实例#端口"（S2S 发送）。
#   props:  按处理器名给属性。通用键 period（调度周期）、state: stopped（不启动）；G 的 text（内容，支持 EL）；
#           U/R/J 的其余键是动态属性（属性 / 路由 / JSON 路径）；T 的 text（整段替换）；F/GF/LF 的 dir（相对 dirs.out / dirs.mq）；
#           LH 的 port、path；IH 的 url；M 的 entries、age；RF 的 retries；其余键按 NiFi 属性名或显示名原样设置。
#           组级 start: false = 搭好但不启动。
#   每个 F 前自动插一个 U "Set file name (<F 名>)"，文件名按分钟轮换（每个出口目录最多 60 个文件）。
#   没连出去的关系一律自动终止。c250 上的 G/GF/LF 只在主节点跑。
#   links:  root 画布上组与组之间的连线 "组.端口 > 组.端口"；"(root).端口" 指 root 画布上的端口（1.9.2 的 S2S 接收端口只能在 root）。
#
# answer: 正确答案（业务、各段、入口出口、跨实例交接、公共环节、陷阱的正确判法）。

dirs:
  out: ~/nifi-lab/cx/out      # 出口（各实例一个子目录）
  mq: ~/nifi-lab/cx/mq        # 模拟 MQ / 共享目录交接（GetFile 取走即删）

instances:
  n112: {api: "https://localhost:18443/nifi-api", s2s: "https://localhost:18443/nifi", dn: ["CN=n112.lab, OU=NIFI"], role: "上海边缘网关（订单、发票、报关中转、发货通知）"}
  n192: {api: "https://localhost:18447/nifi-api", s2s: "https://localhost:18447/nifi", dn: ["CN=n192.lab, OU=NIFI"], role: "老报关网关 1.9.2（报关回执、报关申报、关税表）"}
  n200: {api: "https://localhost:18444/nifi-api", s2s: "https://localhost:18444/nifi", dn: ["CN=n200.lab, OU=NIFI"], role: "合作方枢纽（库存回传、对账、退货、订单确认）"}
  c250: {api: "https://localhost:18445/nifi-api", s2s: "https://localhost:18445/nifi", dn: ["CN=node1.lab, OU=NIFI", "CN=node2.lab, OU=NIFI"], cluster: true, role: "核心集成集群（ERP 过账、主数据、审计、死信）"}

groups:
# ============================== n112 ==============================
- name: cx-order-intake
  instance: n112
  paths:
    - "G:Receive orders (SFTP) > U:Tag SFTP orders > fn:Collect orders"
    - "G:Receive orders (EDI VAN) > U:Tag EDI orders > Collect orders"
    - "LH:Receive orders (B2B API) > U:Tag API orders > Collect orders"
    - "Collect orders > MT:Detect order format > Normalize/in"
    - "Normalize/out > U:Stamp order received > out:to-validate"
    - "Normalize/bad > out:errors"
  props:
    Receive orders (SFTP): {period: "40 sec", text: '{"order_id":"SO${random():mod(900000):plus(100000)}","customer":"C${random():mod(500)}","type":"${random():mod(3):equals(0):ifElse(''export'',''domestic'')}","lines":[{"sku":"A1","qty":2},{"sku":"B7","qty":1}]}'}
    Receive orders (EDI VAN): {period: "75 sec", text: '{"order_id":"EO${random():mod(900000)}","customer":"C${random():mod(500)}","type":"export","lines":[{"sku":"Z9","qty":5}]}'}
    Receive orders (B2B API): {port: 19081, path: orders}
    Tag SFTP orders: {order.channel: sftp, biz.type: order}
    Tag EDI orders: {order.channel: edi, biz.type: order}
    Tag API orders: {order.channel: api, biz.type: order}
    Stamp order received: {order.received_at: "${now():format('yyyy-MM-dd HH:mm:ss')}", correlation_id: "${UUID()}"}
  sub:
    - name: Normalize
      paths:
        - "in:in > J:Extract order header > R:Order complete?[complete] > EDI mapping/in"
        - "Extract order header[unmatched,failure] > out:bad"
        - "Order complete?[unmatched] > U:Mark incomplete order > bad"
        - "EDI mapping/out > U:Set order defaults > out:out"
      props:
        Extract order header: {order.id: "$.order_id", order.customer: "$.customer", order.type: "$.type"}
        Order complete?: {complete: "${order.id:isEmpty():not():and(${order.customer:isEmpty():not()})}"}
        Mark incomplete order: {error.reason: incomplete-order}
        Set order defaults: {order.currency: CNY, order.priority: "${order.type:equals('export'):ifElse('high','normal')}"}
      sub:
        - name: EDI mapping
          paths:
            - "in:in > R:Mapping needed?[orders] > T:Map EDI ORDERS to JSON > fn:Mapped > out:out"
            - "Mapping needed?[unmatched] > Mapped"
          props:
            Mapping needed?: {orders: "${order.channel:equals('edi')}"}
            Map EDI ORDERS to JSON: {text: '{"order_id":"${order.id}","customer":"${order.customer}","type":"${order.type}","mapped":"edi"}'}

- name: cx-invoice-mail
  instance: n112
  paths:
    - "G:Fetch invoice mails (IMAP) > U:Stamp trace id > U:mail_attachment_reader > S:Split attachments > MT:Detect attachment type > H:Fingerprint attachment > R:Attachment type?[pdf] > U:Tag PDF invoice > out:to-validate"
    - "Fingerprint attachment[failure] > errors"
    - "Attachment type?[xml] > U:Tag XML invoice > to-validate"
    - "Attachment type?[unmatched] > U:Mark unsupported attachment > out:errors"
    - "Split attachments[failure] > errors"
  props:
    Fetch invoice mails (IMAP): {period: "60 sec", text: "invoice-${random():mod(9999)}.pdf\nremittance-${random():mod(9999)}.xml\nlogo.png"}
    Stamp trace id: {correlation_id: "${UUID()}", schedule_name: invoice_mail_parse, biz.type: invoice}
    mail_attachment_reader: {e2e.worker: mail_attachment_reader}
    Split attachments: {Line Split Count: 1}
    Attachment type?: {pdf: "${filename:isEmpty():not():and(${random():mod(3):equals(0)})}", xml: "${random():mod(3):equals(1)}"}
    Tag PDF invoice: {invoice.format: pdf}
    Tag XML invoice: {invoice.format: xml}
    Mark unsupported attachment: {error.reason: unsupported-attachment}

- name: cx-customs-inbound
  instance: n112
  paths:
    - "rin:cx-customs-in > U:Tag customs receipts > out:to-validate"
  props:
    Tag customs receipts: {biz.type: customs, customs.via: n192}

- name: cx-common-validate
  instance: n112
  shared: true
  paths:
    - "in:in > U:Stamp gateway receipt > H:Fingerprint payload > R:Schema check (simulated)[valid] > R:Dispatch by business type[order] > out:orders"
    - "Dispatch by business type[invoice] > out:invoices"
    - "Dispatch by business type[customs] > out:customs"
    - "Dispatch by business type[unmatched] > U:Mark unknown business > out:rejects"
    - "Schema check (simulated)[unmatched] > U:Mark schema violation > rejects"
    - "Fingerprint payload[failure] > rejects"
  props:
    Stamp gateway receipt: {gateway.node: n112, gateway.at: "${now():toNumber()}"}
    Schema check (simulated): {valid: "${random():mod(20):gt(0)}"}
    Dispatch by business type: {order: "${biz.type:equals('order')}", invoice: "${biz.type:equals('invoice')}", customs: "${biz.type:equals('customs')}"}
    Mark unknown business: {error.reason: unknown-business}
    Mark schema violation: {error.reason: schema-violation}

- name: cx-order-route
  instance: n112
  paths:
    - "in:in > U:Prepare order routing > Enrich customer/in"
    - "Enrich customer/out > R:Order type?[domestic] > M:Batch orders for ERP > U:Name ERP batch > rpg:c250#cx-orders-in"
    - "Order type?[export] > D:Copy export order > Batch orders for ERP"
    - "Copy export order > F:Copy export orders for customs broker"
    - "Order type?[unmatched] > out:errors"
    - "Batch orders for ERP[failure] > errors"
    - "Name ERP batch > A:Audit order batch > out:audit"
  props:
    Prepare order routing: {route.at: "${now():toNumber()}"}
    Order type?: {domestic: "${order.type:equals('domestic')}", export: "${order.type:equals('export')}"}
    Batch orders for ERP: {entries: 5, age: "90 sec", Delimiter Strategy: Text, Demarcator: "\n"}
    Name ERP batch: {erp.batch: "ORD-${now():format('yyyyMMddHHmm')}", biz.type: order}
    Copy export order: {Number of Copies: 1}
    Copy export orders for customs broker: {dir: broker-orders}
  sub:
    - name: Enrich customer
      paths:
        - "in:in > U:Look up customer (cache) > R:Customer known?[known] > Credit check/in"
        - "Customer known?[unmatched] > U:Default customer terms > Credit check/in"
        - "Credit check/out > out:out"
      props:
        Look up customer (cache): {customer.segment: "${random():mod(3)}"}
        Customer known?: {known: "${random():mod(10):gt(0)}"}
        Default customer terms: {customer.terms: NET30}
      sub:
        - name: Credit check
          paths:
            - "in:in > U:Read credit limit > R:Within credit limit?[ok] > out:out"
            - "Within credit limit?[unmatched] > U:Flag credit hold > out"
          props:
            Read credit limit: {credit.limit: "${random():mod(100000)}"}
            Within credit limit?: {ok: "${credit.limit:toNumber():gt(5000)}"}
            Flag credit hold: {order.hold: credit}

- name: cx-invoice-extract
  instance: n112
  paths:
    - "in:in > U:invoice_pdf_extractor > T:Render invoice JSON > J:Read invoice totals > R:Amount plausible?[ok] > rpg:c250#cx-invoice-in"
    - "Read invoice totals[unmatched,failure] > out:errors"
    - "Amount plausible?[unmatched] > U:Hold for manual check > errors"
    - "invoice_pdf_extractor > A:Audit invoice extract > out:audit"
  props:
    invoice_pdf_extractor: {e2e.worker: invoice_pdf_extractor}
    Render invoice JSON: {text: '{"invoice_no":"INV${random():mod(99999)}","amount":${random():mod(50000)},"currency":"CNY"}'}
    Read invoice totals: {invoice.no: "$.invoice_no", invoice.amount: "$.amount"}
    Amount plausible?: {ok: "${invoice.amount:toNumber():lt(49000)}"}
    Hold for manual check: {error.reason: invoice-amount}

- name: cx-customs-forward
  instance: n112
  paths:
    - "in:in > U:customs_status_mapper > RC:Receipt accepted?[accepted] > U:Mark accepted receipt > fn:To core > rpg:c250#cx-customs-in"
    - "Receipt accepted?[unmatched] > U:Mark rejected receipt > To core"
    - "customs_status_mapper > L:Log customs receipt"
  props:
    customs_status_mapper: {e2e.worker: customs_status_mapper}
    Receipt accepted?: {accepted: "(?s).*ACK.*"}
    Mark accepted receipt: {customs.status: accepted}
    Mark rejected receipt: {customs.status: rejected}
    Log customs receipt: {Log Level: debug}

- name: cx-asn-deliver
  instance: n112
  paths:
    - "LF:Consume ASN queue (MQ) > FF:Fetch ASN message > U:Look up customer channel > T:Map ASN to EDI DESADV > H:Checksum DESADV > R:Customer channel?[as2] > F:Send ASN to customer (AS2)"
    - "Customer channel?[mail] > F:Send ASN by mail (outbox)"
    - "Customer channel?[unmatched] > out:errors"
    - "Fetch ASN message[failure,not.found,permission.denied] > errors"
    - "Map ASN to EDI DESADV > A:Audit ASN > out:audit"
  props:
    Consume ASN queue (MQ): {dir: asn, period: "15 sec", Minimum File Age: "5 sec"}
    Fetch ASN message: {Completion Strategy: Delete File}
    Look up customer channel: {asn.partner: "${random():mod(50)}"}
    Map ASN to EDI DESADV: {text: "UNH+1+DESADV:D:96A:UN'BGM+351+${filename}'"}
    Customer channel?: {as2: "${random():mod(2):equals(0)}", mail: "${random():mod(2):equals(1)}"}
    Send ASN to customer (AS2): {dir: asn-as2}
    Send ASN by mail (outbox): {dir: asn-mail}

- name: cx-wms-bridge
  instance: n112
  paths:
    - "G:Poll WMS stock deltas (DB) > T:Render stock delta CSV > U:Stamp stock batch > IH:Push stock updates to partner hub (HTTP)[Response] > L:Log hub answer"
    - "Push stock updates to partner hub (HTTP)[Retry,Failure,No Retry] > U:Count push retries > R:Retry push?[retry] > Push stock updates to partner hub (HTTP)"
    - "Retry push?[unmatched] > out:errors"
  props:
    Poll WMS stock deltas (DB): {period: "50 sec", text: "x"}
    Render stock delta CSV: {text: "sku,warehouse,qty\nA1,SH01,${random():mod(100)}\nB7,SH01,${random():mod(100)}\nZ9,SH02,${random():mod(100)}"}
    Stamp stock batch: {stock.batch: "WMS-${now():format('HHmmss')}", mime.type: text/csv}
    Push stock updates to partner hub (HTTP): {url: "http://127.0.0.1:19090/stock", HTTP Method: POST}
    Count push retries: {retry.count: "${retry.count:replaceNull(0):plus(1)}"}
    Retry push?: {retry: "${retry.count:lt(3)}"}
    Log hub answer: {Log Level: debug}

- name: cx-mdm-apply
  instance: n112
  paths:
    - "rin:cx-mdm-n112 > J:Read MDM entity > R:Entity type?[product] > U:Map product master > F:Apply product master (local cache)"
    - "Entity type?[customer] > U:Map customer master > F:Apply customer master (local cache)"
    - "Entity type?[unmatched] > out:errors"
    - "Read MDM entity[unmatched,failure] > errors"
  props:
    Read MDM entity: {mdm.entity: "$.entity", mdm.key: "$.key"}
    Entity type?: {product: "${mdm.entity:equals('product')}", customer: "${mdm.entity:equals('customer')}"}
    Map product master: {mdm.target: product-cache}
    Map customer master: {mdm.target: customer-cache}
    Apply product master (local cache): {dir: mdm-product}
    Apply customer master (local cache): {dir: mdm-customer}

- name: cx-common-errors
  instance: n112
  shared: true
  paths:
    - "in:in > U:Classify error > R:Retryable?[transient] > U:Count error retries > R:Retry budget left?[retry] > CR:Throttle error replays > L:Log transient error"
    - "Retry budget left?[unmatched] > Serialize error context"
    - "Retryable?[unmatched] > A:Serialize error context > U:Tag dead letter > rpg:c250#cx-dlq-in"
    - "Serialize error context > F:Write local error log"
  props:
    Classify error: {error.node: n112, error.class: "${error.reason:replaceNull('unknown')}"}
    Retryable?: {transient: "${error.class:equals('unknown')}"}
    Count error retries: {error.retries: "${error.retries:replaceNull(0):plus(1)}"}
    Retry budget left?: {retry: "${error.retries:lt(3)}"}
    Throttle error replays: {Rate Control Criteria: flowfile count, Maximum Rate: 10, Time Duration: "1 min"}
    Log transient error: {Log Level: debug}
    Tag dead letter: {dlq.from: n112}
    Write local error log: {dir: errors}

- name: cx-common-audit
  instance: n112
  shared: true
  paths:
    - "in:in > U:Stamp audit source > M:Batch audit records > Z:Compress audit batch > F:Write audit trail"
  props:
    Stamp audit source: {audit.node: n112}
    Batch audit records: {entries: 10, age: "2 min"}
    Write audit trail: {dir: audit}

- name: cx-order-intake-replay
  instance: n112
  trap: "名字像 cx-order-intake，是人工重放工具，目录平时是空的（运行中但无流量）"
  paths:
    - "GF:Pick up replay files (manual) > U:Tag replay > L:Log replayed order"
  props:
    Pick up replay files (manual): {dir: order-replay, period: "60 sec"}
    Tag replay: {order.replay: "true"}
    Log replayed order: {Log Level: debug}

# ============================== n192 (1.9.2) ==============================
- name: (root)
  instance: n192
  paths:
    - "rin:cx-declare-in"
    - "rin:cx-mdm-n192"

- name: cx-customs-receipt
  instance: n192
  paths:
    - "G:Receive customs receipts (EDI) > U:Stamp receipt trace id > U:customs_receipt_reader > S:Split receipt lines > Validate receipt syntax/in"
    - "Validate receipt syntax/ok > RC:Receipt line type?[receipt] > U:Tag receipt line > out:to-validate"
    - "Receipt line type?[unmatched] > LM:Note ignored receipt line"
    - "Split receipt lines[failure] > out:errors"
    - "Receive customs receipts (EDI) > Archive raw receipt/in"
  props:
    Receive customs receipts (EDI): {period: "45 sec", text: "UNB+UNOC:3+CUSTOMS+SHGW'\nRCPT+DEC${random():mod(99999)}+${random():mod(4):equals(0):ifElse('REJ','ACK')}'\nUNZ+1'"}
    Stamp receipt trace id: {correlation_id: "${UUID()}", schedule_name: customs_receipt, biz.type: customs-receipt}
    customs_receipt_reader: {e2e.worker: customs_receipt_reader}
    Split receipt lines: {Line Split Count: 1}
    Receipt line type?: {receipt: "^RCPT.*"}
    Tag receipt line: {customs.decl: "${random():mod(99999)}"}
    Note ignored receipt line: {log-message: "ignored line ${filename}", log-level: debug}
  sub:
    - name: Validate receipt syntax
      paths:
        - "in:in > U:Count receipt segments > RC:Segment terminator present?[ok] > U:Mark syntax ok > out:ok"
        - "Segment terminator present?[unmatched] > U:Mark syntax warning > ok"
      props:
        Count receipt segments: {edi.segments: "${random():mod(5):plus(1)}"}
        Segment terminator present?: {ok: "(?s).*'.*"}
        Mark syntax ok: {edi.syntax: ok}
        Mark syntax warning: {edi.syntax: warning}
    - name: Archive raw receipt
      paths:
        - "in:in > Z:Compress raw receipt > U:Name raw receipt > F:Archive raw receipt (legacy NAS)"
      props:
        Name raw receipt: {archive.kind: customs-receipt}
        Archive raw receipt (legacy NAS): {dir: receipt-archive}

- name: cx-customs-receipt-send
  instance: n192
  paths:
    - "in:in > U:Prepare receipt for edge > M:Bundle receipts > U:Set bundle id > H:Sign receipt bundle (hash) > rpg:n112#cx-customs-in"
    - "Sign receipt bundle (hash)[failure] > errors"
    - "Bundle receipts[failure] > out:errors"
  props:
    Prepare receipt for edge: {customs.route: edge-sh}
    Bundle receipts: {entries: 3, age: "60 sec"}
    Set bundle id: {bundle.id: "${UUID()}", biz.type: customs}

- name: cx-customs-declare-edi
  instance: n192
  paths:
    - "in:in > U:Tag declaration > J:Read declaration > CUSDEC segments/in"
    - "CUSDEC segments/out > T:Map to customs EDI CUSDEC > U:Stamp declaration id > out:to-validate"
    - "Read declaration[unmatched,failure] > out:errors"
  props:
    Tag declaration: {biz.type: customs-declaration}
    Read declaration: {decl.shipment: "$.shipment", decl.country: "$.country"}
    Map to customs EDI CUSDEC: {text: "UNH+1+CUSDEC:D:96B:UN'BGM+929+${decl.shipment}'LOC+${decl.country}'"}
    Stamp declaration id: {decl.id: "DEC${random():mod(99999)}"}
  sub:
    - name: CUSDEC segments
      paths:
        - "in:in > U:Build BGM segment > U:Build LOC segment > U:Build GIS segment > R:Licence needed?[licence] > U:Attach export licence > fn:Segments done > out:out"
        - "Licence needed?[unmatched] > Segments done"
      props:
        Build BGM segment: {edi.bgm: "929"}
        Build LOC segment: {edi.loc: "${decl.country}"}
        Build GIS segment: {edi.gis: "23"}
        Licence needed?: {licence: "${decl.country:equals('US')}"}
        Attach export licence: {edi.licence: "EL${random():mod(9999)}"}

- name: cx-customs-declare-send
  instance: n192
  paths:
    - "in:in > R:Declaration channel?[edi] > F:Send declaration to customs (EDI outbox) "
    - "Declaration channel?[edi] > U:Build declaration ack > T:Render declaration ack > rpg:c250#cx-declare-ack"
    - "Build declaration ack > out:audit"
    - "Declaration channel?[unmatched] > out:errors"
  props:
    Declaration channel?: {edi: "${random():mod(10):lt(9)}"}
    Send declaration to customs (EDI outbox): {dir: customs-outbox}
    Build declaration ack: {decl.status: submitted}
    Render declaration ack: {text: '{"decl_id":"${decl.id}","status":"submitted"}'}

- name: cx-tariff-sync
  instance: n192
  paths:
    - "G:Download tariff tables (customs portal) > T:Render tariff CSV > U:Load previous tariff version > R:Tariff changed?[changed] > C:Convert tariff CSV to JSON > U:Tag tariff table > out:to-validate"
    - "Tariff changed?[unmatched] > LM:Note unchanged tariff"
    - "Convert tariff CSV to JSON[failure] > out:errors"
  props:
    Download tariff tables (customs portal): {period: "90 sec", text: "x"}
    Render tariff CSV: {text: "hs_code,rate,country\n8471300000,0.0,CN\n6403990000,0.1,CN\n9403600000,0.05,DE"}
    Tag tariff table: {biz.type: tariff}
    Load previous tariff version: {tariff.prev: "${now():format('yyyyMMdd')}"}
    Tariff changed?: {changed: "${random():mod(4):gt(0)}"}
    Note unchanged tariff: {log-message: "tariff unchanged", log-level: debug}

- name: cx-tariff-publish
  instance: n192
  paths:
    - "in:in > SJ:Split tariff rows > U:Key tariff row > M:Collect tariff rows > F:Publish tariff table (customs share)"
    - "Split tariff rows[failure] > out:errors"
  props:
    Split tariff rows: {JsonPath Expression: "$.*"}
    Key tariff row: {tariff.version: "${now():format('yyyyMMdd')}"}
    Collect tariff rows: {entries: 3, age: "60 sec"}
    Publish tariff table (customs share): {dir: tariff}

- name: cx-mdm-apply
  instance: n192
  paths:
    - "in:in > J:Read MDM entity > R:Relevant for customs?[product] > U:Map HS master data > U:Convert to legacy code page > T:Render legacy DB record > F:Apply HS master data (legacy DB)"
    - "Relevant for customs?[unmatched] > LM:Skip non-customs master data"
    - "Read MDM entity[unmatched,failure] > out:errors"
  props:
    Read MDM entity: {mdm.entity: "$.entity", mdm.key: "$.key"}
    Relevant for customs?: {product: "${mdm.entity:equals('product')}"}
    Map HS master data: {mdm.target: hs-master}
    Convert to legacy code page: {legacy.codepage: GBK}
    Render legacy DB record: {text: "HS|${mdm.key}|${mdm.entity}"}
    Skip non-customs master data: {log-message: "skip ${mdm.entity}", log-level: debug}
    Apply HS master data (legacy DB): {dir: mdm-hs}

- name: cx-common-legacy-validate
  instance: n192
  shared: true
