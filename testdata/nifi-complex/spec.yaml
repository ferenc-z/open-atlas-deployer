e2e:
  # ClickHouse e2e_trace 的 schedule（seed-cx.sql 造定义和运行记录）；worker 名 = 画布上处理器名
  - id: 201
    name: invoice_mail_parse
    workers: [mail_attachment_reader, invoice_pdf_extractor, invoice_erp_poster, invoice_approval_notifier]
    trigger: {exchange: ex.trigger, routing_key: invoice.mail}
    note: "invoice_approval_notifier 只在 schedule 里（画布上没有，是审批系统里的步骤）"
  - id: 202
    name: customs_receipt
    workers: [customs_receipt_reader, customs_status_mapper, customs_erp_updater]
    trigger: {exchange: ex.trigger, routing_key: customs.receipt}

answer:
  # seg 写法：实例/组（组内多片时 "实例/组#片"，片用该片里一个处理器名指代）；hop：s2s / mq（共享目录）/ http / link（同实例 root 连线）
  businesses:
    - id: B1
      name: 订单接入到 ERP 并回确认
      segments: [n112/cx-order-intake, n112/cx-order-route, c250/cx-erp-order-post, n200/cx-order-confirm]
      shared: [n112/cx-common-validate, n112/cx-common-errors, n112/cx-common-audit, c250/cx-common-audit, c250/cx-common-dlq, n200/cx-common-audit, n200/cx-common-errors]
      entries: ["Receive orders (SFTP)", "Receive orders (EDI VAN)", "Receive orders (B2B API)（由 n200 cx-partner-gateway 经 HTTP 推入）"]
      exits: ["Copy export orders for customs broker", "Write ERP order file", "Send confirmation to partner (AS2)", "Send confirmation by mail (outbox)"]
      hops: ["n112 cx-order-intake -link-> cx-common-validate -link(orders)-> cx-order-route", "n112 -s2s cx-orders-in-> c250", "c250 -s2s cx-order-confirm-in-> n200"]
      judge: "三个实例一条业务。cx-order-intake 和 cx-order-route 中间隔着公共校验（按 biz.type 分发），骨架不会自动合，要靠 AI 合；n200 的 cx-partner-gateway 经 HTTP 推到 ListenHTTP，是第三个入口（HTTP 交接引擎认不出时，分成单独一条也算可接受，但要标成外部出口）。"
    - id: B2
      name: 发票邮件解析入 ERP
      segments: [n112/cx-invoice-mail, n112/cx-invoice-extract, c250/cx-invoice-post]
      shared: [n112/cx-common-validate, n112/cx-common-errors, n112/cx-common-audit, c250/cx-common-audit, c250/cx-common-archive, c250/cx-common-dlq]
      entries: ["Fetch invoice mails (IMAP)"]
      exits: ["Write invoice to ERP inbox", "（schedule）invoice_approval_notifier"]
      hops: ["n112 经公共校验分发(invoices)", "n112 -s2s cx-invoice-in-> c250"]
      e2e: 201
      judge: "按 schedule 201 认：worker 在 n112 两个组和 c250 一个组上；invoice_approval_notifier 只在 schedule 里，作为 schedule 步骤保留、不放到画布上、不当缺口。"
    - id: B3
      name: 银行对账
      segments: ["c250/cx-erp-batch#Nightly GL export", "n200/cx-recon#Receive bank statements (SWIFT MT940)", "n200/cx-recon#Consume ledger queue (MQ)", c250/cx-recon-post]
      shared: [n200/cx-common-errors, c250/cx-common-audit]
      entries: ["Nightly GL export", "Receive bank statements (SWIFT MT940)"]
      exits: ["Post reconciliation result (ERP)", "Queue recon result for accountant"]
      hops: ["c250 -mq ledger-> n200", "n200 cx-recon 两片经 recon-staging 目录交接", "n200 -s2s cx-recon-result-> c250"]
      judge: "c250→n200→c250 来回跳。cx-recon 的两片骨架会拆开并提问，正确答案是一件事（目录交接）；c250 cx-erp-batch 的总账导出片属于这条，不属于成本中心同步。"
    - id: B4
      name: 报关回执回写 ERP
      segments: [n192/cx-customs-receipt, n192/cx-customs-receipt-send, n112/cx-customs-inbound, n112/cx-customs-forward, c250/cx-customs-update]
      shared: [n192/cx-common-legacy-validate, n192/cx-common-legacy-errors, n112/cx-common-validate, n112/cx-common-errors, c250/cx-common-audit, c250/cx-common-archive, c250/cx-common-dlq]
      entries: ["Receive customs receipts (EDI)"]
      exits: ["Archive raw receipt (legacy NAS)", "Update customs status (ERP)"]
      hops: ["n192 经公共校验分发(receipts)", "n192 -s2s cx-customs-in-> n112", "n112 经公共校验分发(customs)", "n112 -s2s cx-customs-in-> c250"]
      e2e: 202
      judge: "经过 3 个实例、两次公共校验。n192 不在 UAT 里时，n112 的 cx-customs-in 是入口（上游未接管）；schedule 202 的 customs_receipt_reader 在 n192 上，n192 未接管时该 worker 放不下（e2e-unplaced 合理）。"
    - id: B5
      name: 出口报关申报
      segments: [c250/cx-customs-declare, "n192/(root)#cx-declare-in", n192/cx-customs-declare-edi, n192/cx-customs-declare-send, c250/cx-customs-declare-ack]
      shared: [n192/cx-common-legacy-validate, n192/cx-common-legacy-errors, c250/cx-common-dlq]
      entries: ["Poll export shipments (ERP)"]
      exits: ["Send declaration to customs (EDI outbox)", "Update declaration status (ERP)"]
      hops: ["c250 -s2s cx-declare-in(n192 root)-> n192", "n192 经公共校验分发(declarations)", "n192 -s2s cx-declare-ack-> c250"]
      judge: "c250→n192→c250 来回跳。名字和 B4 都带 customs，但是两件事（申报 vs 回执）。n192 未接管时 c250 发往 n192 的 S2S 是对不上的外部出口，cx-declare-ack 是 c250 上的入口。"
    - id: B6
      name: 库存回传 ERP
      segments: [n112/cx-wms-bridge, n200/cx-stock-feedback, c250/cx-stock-post]
      shared: [n112/cx-common-errors, n200/cx-common-errors, n200/cx-common-audit, c250/cx-common-audit, c250/cx-common-dlq]
      entries: ["Poll WMS stock deltas (DB)", "Receive stock updates (WMS API)（n112 经 HTTP 推入）", "Poll 3PL stock snapshot (SFTP)"]
      exits: ["Update ERP stock"]
      hops: ["n112 -http 19090-> n200", "n200 -s2s cx-stock-in-> c250"]
      judge: "n200→c250 段骨架能连；n112 cx-wms-bridge 经 HTTP 交接，认成单独一条（出口外部 HTTP）可接受，连上更好。"
    - id: B7
      name: 主数据分发
      segments: [c250/cx-mdm-publish, n112/cx-mdm-apply, n200/cx-mdm-apply, n192/cx-mdm-apply, "n192/(root)#cx-mdm-n192"]
      shared: [n112/cx-common-errors, n200/cx-common-errors, n192/cx-common-legacy-errors, c250/cx-common-dlq]
      entries: ["Poll MDM changes (CDC)"]
      exits: ["Snapshot MDM change", "Apply product master (local cache)", "Apply customer master (local cache)", "Apply partner master (hub DB)", "Apply catalog item (hub DB)", "Apply HS master data (legacy DB)"]
      hops: ["c250 -s2s-> n112 / n200 / n192（一处 fan-out 到三个实例）"]
      judge: "一条业务跨 4 个实例（fan-out）。骨架因 fan-out 不合并并提问，正确答案是一条；三个 cx-mdm-apply 同名不同实例，不能当成三条独立业务，也不能互相合并成别的。"
    - id: B8
      name: 发货通知（ASN）
      segments: [c250/cx-shipment-notice, n112/cx-asn-deliver]
      shared: [n112/cx-common-errors, n112/cx-common-audit, c250/cx-common-dlq]
      entries: ["Poll shipped deliveries (ERP)"]
      exits: ["Send ASN to customer (AS2)", "Send ASN by mail (outbox)"]
      hops: ["c250 -mq asn-> n112"]
      judge: "经共享目录（模拟 MQ）交接，引擎当外部交接：分成两段两条也可以，但最好按目录名把 Publish ASN to queue (MQ) 和 Consume ASN queue (MQ) 对上。"
    - id: B9
      name: 退货退款
      segments: [n200/cx-returns, c250/cx-returns-credit]
      shared: [n200/cx-common-errors, n200/cx-common-audit, c250/cx-common-audit, c250/cx-common-dlq]
      entries: ["Receive return requests (portal)", "Receive return requests (call center)"]
      exits: ["Create credit note (ERP)"]
      hops: ["n200 -s2s cx-returns-in-> c250"]
      judge: "两个入口 fan-in，带嵌套子组 Manual review。"
    - id: B10
      name: 关税表同步
      segments: [n192/cx-tariff-sync, n192/cx-tariff-publish]
      shared: [n192/cx-common-legacy-validate, n192/cx-common-legacy-errors]
      entries: ["Download tariff tables (customs portal)"]
      exits: ["Publish tariff table (customs share)"]
      hops: ["n192 经公共校验分发(tariffs)"]
      judge: "只在 n192（1.9.2）上；n192 未接管时看不到。"
    - id: B11
      name: 成本中心同步
      segments: ["c250/cx-erp-batch#Nightly cost center sync"]
      entries: ["Nightly cost center sync"]
      exits: ["Write cost center file"]
      judge: "和 B3 的总账导出同在 cx-erp-batch 组里、互不相连，是单独一条。"
    - id: B12
      name: 合作方枢纽 QA 测试发票（陷阱）
      segments: [n200/cx-invoice-post-test]
      entries: ["Generate test invoices (QA)"]
      exits: ["（自动终止）"]
