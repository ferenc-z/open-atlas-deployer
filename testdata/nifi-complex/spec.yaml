  notes:
    - "S2S 汇入公共环节：c250 cx-common-dlq 的远程端口 cx-dlq-in 收 n112、n200、n192 三处公共错误处理发来的死信，加本地 9 个组的 errors，是公共环节，不是业务。"
    - "公共错误/审计环节没有自己的起点，被 ≥2 个组喂，应识别为 shared；不能把公共环节算成某条业务独有的一段。"
    - "既有组（ops-lab、n112 gen/rename、c250 load、e2e gen 链等）不属于本实验，答案里不列。"
