    - "Dead letters > R:Alert needed?[alert] > LM:Raise DLQ alert"
    - "Dead letters > R:Replayable?[replay] > U:Prepare DLQ replay > L:Log DLQ replay candidate"
    - "Dead letters > F:Write dead letter"
  props:
    Tag remote dead letter: {dlq.kind: remote}
    Tag local dead letter: {dlq.kind: local, dlq.from: c250}
    Alert needed?: {alert: "${error.class:equals('schema-violation')}"}
    Raise DLQ alert: {log-message: "DLQ ${dlq.from} ${error.class}", log-level: debug}
    Write dead letter: {dir: dlq}
    Replayable?: {replay: "${error.class:equals('recon-open-items')}"}
    Prepare DLQ replay: {dlq.replay: "true"}
    Log DLQ replay candidate: {Log Level: debug}

- name: cx-legacy-fax-orders
  instance: c250
  trap: "名字像订单接入，是老传真订单入口，运行中但目录一直是空的（无流量）"
  paths:
    - "GF:Receive fax orders (legacy) > U:Tag fax order > F:Write fax order for keying"
  props:
    Receive fax orders (legacy): {dir: fax-orders, period: "60 sec"}
    Tag fax order: {order.channel: fax}
    Write fax order for keying: {dir: fax-keying}

# ------------------------------ 第二批（加复杂度）------------------------------
- name: cx-price-list
  instance: n112
  paths:
    - "G:Receive price lists (SFTP) > T:Render price list CSV > C:Convert price list to JSON > SJ:Split price rows > J:Read price row > R:Price change size?[big] > U:Flag big price change > fn:Prices out"
    - "Price change size?[unmatched] > Prices out"
    - "Prices out > M:Collect store price file > F:Publish price list to stores"
    - "Flag big price change > LM:Notify pricing team"
    - "Convert price list to JSON[failure] > out:errors"
    - "Read price row[unmatched,failure] > errors"
  props:
    Receive price lists (SFTP): {period: "120 sec", text: "x"}
    Render price list CSV: {text: "sku,price,old_price\nA1,${random():mod(100):plus(10)},20\nB7,35,${random():mod(60)}\nZ9,99,99"}
    Split price rows: {JsonPath Expression: "$.*"}
    Read price row: {price.sku: "$.sku", price.new: "$.price", price.old: "$.old_price"}
    Price change size?: {big: "${price.new:toNumber():minus(${price.old:toNumber()}):gt(30)}"}
    Flag big price change: {price.review: "true"}
    Notify pricing team: {log-message: "big change ${price.sku}", log-level: debug}
    Collect store price file: {entries: 3, age: "60 sec"}
    Publish price list to stores: {dir: store-prices}

- name: cx-manifest-legacy
  instance: n192
  paths:
    - "G:Receive cargo manifests (EDI) > U:Tag manifest > S:Split manifest lines > RC:Manifest line kind?[container] > Manifest checks/in"
    - "Manifest line kind?[unmatched] > LM:Note manifest header line"
    - "Manifest checks/ok > T:Map to CUSCAR > U:Stamp manifest no > F:Submit manifest to customs (EDI outbox)"
    - "Stamp manifest no > rpg:c250#cx-manifest-in"
    - "Stamp manifest no > out:audit"
    - "Manifest checks/bad > out:errors"
    - "Split manifest lines[failure] > errors"
  props:
    Receive cargo manifests (EDI): {period: "70 sec", text: "HDR+VESSEL${random():mod(99)}\nCNT+MSKU${random():mod(9999999)}+22G1\nCNT+TGHU${random():mod(9999999)}+45G1"}
    Tag manifest: {biz.type: manifest}
    Split manifest lines: {Line Split Count: 1}
    Manifest line kind?: {container: "^CNT.*"}
    Note manifest header line: {log-message: "header ${filename}", log-level: debug}
    Map to CUSCAR: {text: "UNH+1+CUSCAR:D:95B:UN'EQD+CN+${manifest.container}'"}
    Stamp manifest no: {manifest.no: "MF${random():mod(99999)}"}
    Submit manifest to customs (EDI outbox): {dir: manifest-outbox}
  sub:
    - name: Manifest checks
      paths:
        - "in:in > U:Read container no > R:Container no valid?[valid] > R:Dangerous goods?[dg] > U:Flag dangerous goods > out:ok"
        - "Dangerous goods?[unmatched] > ok"
        - "Container no valid?[unmatched] > U:Mark bad container no > out:bad"
      props:
        Read container no: {manifest.container: "${random():mod(9999999)}"}
        Container no valid?: {valid: "${random():mod(15):gt(0)}"}
        Dangerous goods?: {dg: "${random():mod(8):equals(0)}"}
        Flag dangerous goods: {manifest.dg: "true"}
        Mark bad container no: {error.reason: bad-container-no}

- name: cx-origin-cert
  instance: n192
  paths:
    - "G:Receive certificate of origin requests (portal) > J:Read origin request > R:Preferential origin?[form_e] > U:Fill FORM E > fn:Certificates"
    - "Preferential origin?[unmatched] > U:Fill general certificate > Certificates"
    - "Certificates > T:Render certificate > Z:Pack certificate > H:Sign certificate (hash) > F:Issue certificate (CIQ share)"
    - "Sign certificate (hash) > out:audit"
    - "Read origin request[unmatched,failure] > out:errors"
    - "Sign certificate (hash)[failure] > errors"
  props:
    Receive certificate of origin requests (portal): {period: "100 sec", text: '{"req":"CO${random():mod(9999)}","dest":"${random():mod(2):equals(0):ifElse(''TH'',''DE'')}"}'}
    Read origin request: {co.req: "$.req", co.dest: "$.dest"}
    Preferential origin?: {form_e: "${co.dest:equals('TH')}"}
    Fill FORM E: {co.form: E}
    Fill general certificate: {co.form: general}
    Render certificate: {text: "CERT;${co.req};${co.form};${co.dest}"}
    Issue certificate (CIQ share): {dir: origin-certs}

- name: cx-common-legacy-audit
  instance: n192
  shared: true
  paths:
    - "in:in > U:Stamp legacy audit source > A:Serialize legacy audit record > M:Batch legacy audit > Z:Compress legacy audit > F:Write legacy audit trail"
  props:
    Stamp legacy audit source: {audit.node: n192}
    Batch legacy audit: {entries: 10, age: "3 min"}
    Write legacy audit trail: {dir: audit}

- name: cx-carrier-tracking
  instance: n200
  paths:
    - "G:Poll carrier tracking (DHL API) > U:Tag DHL events > fn:Tracking events"
    - "G:Poll carrier tracking (SF Express API) > U:Tag SF events > Tracking events"
    - "Tracking events > J:Read tracking event > R:Tracking status?[delivered] > U:Mark delivered > fn:To ERP"
    - "Tracking status?[exception] > U:Mark delivery exception > LM:Alert customer service > To ERP"
    - "Tracking status?[unmatched] > CR:Thin out in-transit events > L:Log in-transit event"
    - "To ERP > M:Batch tracking updates > rpg:c250#cx-tracking-in"
    - "Mark delivered > F:Write proof of delivery"
    - "Read tracking event[unmatched,failure] > out:errors"
  props:
    Poll carrier tracking (DHL API): {period: "45 sec", text: '{"awb":"JD${random():mod(99999999)}","status":"${random():mod(4):equals(0):ifElse(''exception'',''delivered'')}"}'}
    Poll carrier tracking (SF Express API): {period: "60 sec", text: '{"awb":"SF${random():mod(99999999)}","status":"in_transit"}'}
    Tag DHL events: {carrier: dhl}
    Tag SF events: {carrier: sf-express}
    Read tracking event: {track.awb: "$.awb", track.status: "$.status"}
    Tracking status?: {delivered: "${track.status:equals('delivered')}", exception: "${track.status:equals('exception')}"}
    Mark delivered: {track.pod: "true"}
    Mark delivery exception: {track.exception: "true"}
    Alert customer service: {log-message: "exception ${track.awb}", log-level: debug}
    Thin out in-transit events: {Rate Control Criteria: flowfile count, Maximum Rate: 5, Time Duration: "1 min"}
    Log in-transit event: {Log Level: debug}
    Batch tracking updates: {entries: 4, age: "90 sec"}
    Write proof of delivery: {dir: pod}

- name: cx-tracking-update
  instance: c250
  paths:
    - "rin:cx-tracking-in > S:Split tracking batch > U:Map delivery status > R:Delivery closed?[closed] > F:Close delivery (ERP)"
    - "Delivery closed?[unmatched] > F:Update delivery status (ERP)"
    - "Map delivery status > out:audit"
    - "Split tracking batch[failure] > out:errors"
  props:
    Split tracking batch: {Line Split Count: 1}
    Map delivery status: {erp.delivery: "${track.status:replaceNull('in_transit')}"}
    Delivery closed?: {closed: "${track.pod:equals('true')}"}
    Close delivery (ERP): {dir: erp-delivery-closed}
    Update delivery status (ERP): {dir: erp-delivery-status}

- name: cx-manifest-track
  instance: c250
  paths:
    - "rin:cx-manifest-in > U:Read manifest status > R:Dangerous cargo?[dg] > F:Notify HSE of dangerous cargo"
    - "Dangerous cargo?[unmatched] > F:Update manifest status (ERP)"
    - "Read manifest status > out:audit"
  props:
    Read manifest status: {erp.manifest: "${manifest.no}"}
    Dangerous cargo?: {dg: "${manifest.dg:equals('true')}"}
    Notify HSE of dangerous cargo: {dir: hse-dg}
    Update manifest status (ERP): {dir: erp-manifest}

