# NiFi lab topology (sourced by setup.sh and lab.sh).
# Step 0 of docs: open-atlas-deployer-service-ops.md §15.1.
# Ports were picked to avoid what already listens on the dev machine
# (8443, 9443, 8090, 8095, 5000, 9631 ...).

LAB="${LAB:-$HOME/nifi-lab}"

ZK_VERSION=3.8.4
ZK_PORT=12181
TOOLKIT_VERSION=1.28.1

# name|nifi version|jdk|https port|cert CN|cluster protocol port|load balance port
# Cluster members have a protocol port; standalone ones use "-".
INSTANCES_TABLE="
n112|1.12.1|11|18443|n112.lab|-|-
n200|2.0.0|21|18444|n200.lab|-|-
c250-1|2.5.0|21|18445|node1.lab|11445|16345
c250-2|2.5.0|21|18446|node2.lab|11446|16346
"

HEAP=1g
CLUSTER_ZK_ROOT=/nifi-lab-c250

# Client certificates signed by the lab CA (toolkit "standalone" mode).
CLIENT_OU="OU=ops-lab"
CLIENT_MONITOR="CN=monitor, $CLIENT_OU"
CLIENT_OPERATOR="CN=operator, $CLIENT_OU"
CLIENT_NGINX="CN=nginx, $CLIENT_OU"

# DN NiFi sees for a node certificate made by tls-toolkit.
node_dn() { echo "CN=$1, OU=NIFI"; }

instances() { echo "$INSTANCES_TABLE" | awk -F'|' 'NF>1{print $1}'; }
inst_field() { # name field-index(2..7)
  echo "$INSTANCES_TABLE" | awk -F'|' -v n="$1" -v f="$2" '$1==n{print $f}'
}
