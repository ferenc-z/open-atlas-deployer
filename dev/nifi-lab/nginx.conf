# The lab's nginx in front of its NiFi (P8, S20): as operations would run it, it holds the NiFi client certificate
# (the lab's "nginx" one) and puts all nodes of a cluster behind one address; Studio talks only to it.
# Bound to 127.0.0.1 only, plain HTTP there (a lab, nothing leaves the machine). Runs as the lab's user, no root:
#   lab.sh nginx start|stop|status     (setup.sh writes @LAB@ in, as $LAB/nginx/nginx.conf)
#
#   http://127.0.0.1:18543  -> n112 (1.12.1)
#   http://127.0.0.1:18544  -> n200 (2.0.0)
#   http://127.0.0.1:18545  -> c250-1, c250-2 (2.5.0 cluster; the next node when one is down)
# Each path goes to /nifi-api/ as is, e.g. http://127.0.0.1:18545/nifi-api/flow/about.
#
# By path, as the company's nginx does it (one nginx, a prefix per NiFi; nginxUrl is the prefix, the Deployer appends
# /nifi-api, so nginx keeps that segment):
#   http://127.0.0.1:18546/n112  -> n112      e.g. http://127.0.0.1:18546/n112/nifi-api/flow/about
#   http://127.0.0.1:18546/n200  -> n200
#   http://127.0.0.1:18546/c250  -> c250-1, c250-2

worker_processes 1;
pid @LAB@/nginx/run/nginx.pid;
error_log @LAB@/nginx/logs/error.log warn;

events { worker_connections 256; }

http {
  access_log @LAB@/nginx/logs/access.log;
  client_body_temp_path @LAB@/nginx/tmp/body;
  proxy_temp_path @LAB@/nginx/tmp/proxy;
  fastcgi_temp_path @LAB@/nginx/tmp/fastcgi;
  uwsgi_temp_path @LAB@/nginx/tmp/uwsgi;
  scgi_temp_path @LAB@/nginx/tmp/scgi;

  # NiFi's REST over mutual TLS with the nginx identity (CN=nginx, OU=ops-lab), checked against the lab CA.
  proxy_ssl_certificate @LAB@/certs/pem/nginx.crt;
  proxy_ssl_certificate_key @LAB@/certs/pem/nginx.key;
  proxy_ssl_trusted_certificate @LAB@/certs/pem/ca.crt;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_server_name on;
  proxy_ssl_name localhost;
  proxy_ssl_session_reuse on;
  # NiFi checks the Host header against nifi.web.https.host (localhost): send that, not the nginx address.
  proxy_set_header Host localhost;
  proxy_http_version 1.1;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  proxy_next_upstream error timeout http_502 http_503;

  upstream n112 { server 127.0.0.1:18443; }
  upstream n200 { server 127.0.0.1:18444; }
  upstream c250 { server 127.0.0.1:18445 max_fails=1 fail_timeout=10s; server 127.0.0.1:18446 max_fails=1 fail_timeout=10s; }

  server { listen 127.0.0.1:18543; location /nifi-api/ { proxy_pass https://n112; } location / { return 404; } }
  server { listen 127.0.0.1:18544; location /nifi-api/ { proxy_pass https://n200; } location / { return 404; } }
  server { listen 127.0.0.1:18545; location /nifi-api/ { proxy_pass https://c250; } location / { return 404; } }
  server {
    listen 127.0.0.1:18546;
    location /n112/nifi-api/ { proxy_pass https://n112/nifi-api/; }
    location /n200/nifi-api/ { proxy_pass https://n200/nifi-api/; }
    location /c250/nifi-api/ { proxy_pass https://c250/nifi-api/; }
    location / { return 404; }
  }
}
