# Types, the server tests, the page build, and the executors' tests (deploy and service) on the oldest Python the hosts may have (3.9) and a
# current one. Run by hand only (Actions → ci → Run workflow): a release tag runs the same checks in release.yml before
# publishing, and commits are checked locally (bin/check.sh).
name: ci
on:
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  executor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v test_deployer_executor test_service_executor
        working-directory: executor
