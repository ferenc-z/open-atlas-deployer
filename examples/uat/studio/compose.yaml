# Generated by Open Atlas Deployer from the app's deploy manifest. Do not edit: change the manifest.
# app studio 2.8.0 (manifest from 2.8.0), environment uat
services:
  studio:
    image: "ghcr.io/gaojie197710-tech/open-atlas-studio:2.8.0"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "studio"
      org.open-atlas.component: "studio"
      org.open-atlas.version: "2.8.0"
    init: true
    stop_grace_period: "60s"
    env_file:
      - "../studio.env"
    ports:
      - "127.0.0.1:9631:9631"
      - "127.0.0.1:9632:9632"
    volumes:
      - "./data:/data/studio"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
