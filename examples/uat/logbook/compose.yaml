# Generated by Open Atlas Deployer from the app's deploy manifest. Do not edit: change the manifest.
# app logbook 0.7.8 (manifest from 0.7.8), environment uat
services:
  logbook-db:
    image: "postgres:16.4"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "logbook"
      org.open-atlas.component: "db"
      org.open-atlas.version: "0.7.8"
    environment:
      POSTGRES_PASSWORD: "${PG_SUPERUSER_PASSWORD}"
      POSTGRES_DB: "logbook"
      AUTHENTICATOR_PASSWORD: "${AUTHENTICATOR_PASSWORD}"
      LOGBOOK_ADMIN_EMAIL: "${LOGBOOK_ADMIN_EMAIL}"
      LOGBOOK_ADMIN_NAME: "${LOGBOOK_ADMIN_NAME}"
    volumes:
      - "./data/pg:/var/lib/postgresql/data"
      - "./files/pkg/db:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d logbook"
      interval: "10s"
      timeout: "5s"
      retries: 30
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  logbook-api:
    image: "postgrest/postgrest:v12.2.3"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "logbook"
      org.open-atlas.component: "api"
      org.open-atlas.version: "0.7.8"
    depends_on:
      logbook-db:
        condition: "service_healthy"
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD}@logbook-db:5432/logbook"
      PGRST_DB_SCHEMAS: "api"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_OPENAPI_SERVER_PROXY_URI: "http://127.0.0.1:3030"
      PGRST_LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:3030:3000"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
