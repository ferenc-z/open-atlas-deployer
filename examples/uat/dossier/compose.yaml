# Generated by Open Atlas Deployer from the app's deploy manifest. Do not edit: change the manifest.
# app dossier 2.17.0 (manifest from 2.17.0), environment uat
services:
  broker:
    image: "valkey/valkey:9-alpine"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "broker"
      org.open-atlas.version: "2.17.0"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  tika:
    image: "apache/tika:3.3.1.0"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "tika"
      org.open-atlas.version: "2.17.0"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  gotenberg:
    image: "gotenberg/gotenberg:8.37"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "gotenberg"
      org.open-atlas.version: "2.17.0"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  paperless:
    image: "ghcr.io/paperless-ngx/paperless-ngx:3.2.1"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "paperless"
      org.open-atlas.version: "2.17.0"
    depends_on:
      broker:
        condition: "service_started"
      tika:
        condition: "service_started"
      gotenberg:
        condition: "service_started"
    environment:
      PAPERLESS_REDIS: "redis://broker:6379"
      PAPERLESS_DBENGINE: "postgresql"
      PAPERLESS_DBHOST: "${PAPERLESS_DBHOST}"
      PAPERLESS_DBPORT: "${PAPERLESS_DBPORT}"
      PAPERLESS_DBNAME: "${PAPERLESS_DBNAME}"
      PAPERLESS_DBUSER: "${PAPERLESS_DBUSER}"
      PAPERLESS_DBPASS: "${PAPERLESS_DBPASS}"
      PAPERLESS_DB_OPTIONS: "${PAPERLESS_DB_OPTIONS}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY}"
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
      PAPERLESS_URL: "${DOSSIER_PUBLIC_URL}"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: "${DOSSIER_PUBLIC_URL}"
      PAPERLESS_ALLOWED_HOSTS: "${PAPERLESS_ALLOWED_HOSTS}"
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: "http://tika:9998"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://gotenberg:3000"
      PAPERLESS_OCR_LANGUAGE: "${PAPERLESS_OCR_LANGUAGE}"
    ports:
      - "127.0.0.1:18110:8000"
    volumes:
      - "./data/paperless/media:/usr/src/paperless/media"
      - "./data/paperless/data:/usr/src/paperless/data"
      - "./data/paperless/consume:/usr/src/paperless/consume"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  dossier:
    image: "ghcr.io/gaojie197710-tech/open-atlas-dossier:2.17.0"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "dossier"
      org.open-atlas.version: "2.17.0"
    init: true
    stop_grace_period: "60s"
    depends_on:
      paperless:
        condition: "service_started"
    env_file:
      - "../dossier.env"
    environment:
      DOSSIER_DATABASE_URL: "${DOSSIER_DATABASE_URL}"
      PAPERLESS_URL: "http://paperless:8000"
      DOSSIER_PUBLIC_URL: "${DOSSIER_PUBLIC_URL}"
    ports:
      - "127.0.0.1:18102:18102"
    volumes:
      - "./data/dossier:/data/dossier"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
  dossier-proxy:
    image: "caddy:2-alpine"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "dossier"
      org.open-atlas.component: "proxy"
      org.open-atlas.version: "2.17.0"
    depends_on:
      paperless:
        condition: "service_started"
      dossier:
        condition: "service_healthy"
    environment:
      DOSSIER_UPSTREAM: "dossier:18102"
      PROXY_SITE: "${PROXY_SITE}"
      PROXY_TLS: "${PROXY_TLS}"
      PROXY_REDIRECT_PORT: "80"
      PROXY_PUBLIC_URL: "${DOSSIER_PUBLIC_URL}"
    ports:
      - "127.0.0.1:18100:80"
      - "127.0.0.1:18143:443"
    volumes:
      - "./files/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./certs:/etc/caddy/certs"
      - "./data/proxy:/data"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
