# Generated by Open Atlas Deployer from the app's deploy manifest. Do not edit: change the manifest.
# app workbench 1.23.1 (manifest from 1.23.1), environment uat
services:
  workbench:
    image: "ghcr.io/gaojie197710-tech/open-atlas-workbench:1.23.1"
    restart: "unless-stopped"
    labels:
      org.open-atlas.app: "workbench"
      org.open-atlas.component: "workbench"
      org.open-atlas.version: "1.23.1"
    init: true
    stop_grace_period: "60s"
    env_file:
      - "../workbench.env"
    environment:
      WORKBENCH_DATA_PLANE_URL: "http://studio:9632"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - "./data:/data/workbench"
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "3"
